name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Audit only third-party runtime deps (horus itself isn't on PyPI,
      # which would make `pip-audit --strict` fail with "not found on PyPI").
      - name: Install runtime dependencies
        run: pip install "flask>=3.0" pyyaml "gunicorn>=21.0" "werkzeug>=3.0"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --strict

  quality:
    name: quality (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    fail-fast: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dev dependencies
        run: pip install -e ".[dev,server]"

      - name: Run ruff
        run: ruff check horus/

      - name: Run mypy
        run: mypy horus/

      - name: Run pytest
        run: python -m pytest tests/ -q --no-cov

      - name: Verify Dockerfile builds
        run: docker build -t horus:ci .
