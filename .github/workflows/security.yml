name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Audit only third-party runtime deps that ship in the Docker image.
      # horus itself isn't on PyPI, so we install deps explicitly (not -e ".").
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flask>=3.0" pyyaml "gunicorn>=21.0" "werkzeug>=3.0"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit transitive deps too (--no-deps omits them).
      # Non-strict: surface findings in logs without failing CI on
      # tool-only CVEs (pip, setuptools) that never reach runtime.
      # Direct deps (flask, gunicorn, werkzeug, pyyaml) are rare CVE targets.
      - name: Run pip-audit
        run: pip-audit -v

  quality:
    name: quality (ruff, mypy, pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dev dependencies
        run: pip install -e ".[dev,server]"

      - name: Run ruff
        run: ruff check horus/

      # Strict check only on cleaned core layers (per mypy overrides
      # in pyproject.toml). Other modules still get basic checks via
      # the top-level config but aren't blocked on full annotation.
      - name: Run mypy (core strict)
        run: mypy horus/core horus/pipeline.py horus/storage horus/net

      - name: Run mypy (remainder, permissive)
        run: mypy horus/ --follow-imports=skip || true

      - name: Run pytest
        run: python -m pytest tests/ -q --no-cov

      # Verify Dockerfile builds — non-blocking since Docker layer
      # cache fresh runners can exceed job time limits.
      - name: Verify Dockerfile builds
        continue-on-error: true
        run: docker build -t horus:ci .
