[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "horus"
version = "0.9.0"
description = "CVE + PoC discovery pipeline with reputation scoring and a Flask UI."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "lizard", email = "code.yusif.v@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
web    = ["flask>=3.0", "werkzeug>=3.0"]
server = ["flask>=3.0", "pyyaml", "gunicorn>=21.0", "werkzeug>=3.0"]
dev    = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
horus = "horus.cli:main"

[tool.setuptools.packages.find]
include = ["horus*"]
namespaces = true

# ── ruff ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by formatter, not lint
    "SIM108", # ternary-vs-if-else is taste; both can be clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]      # tests use plain assert

[tool.ruff.format]
quote-style = "double"

# ── mypy ───────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

# Strict only on the layers we've cleaned.
[[tool.mypy.overrides]]
module = ["horus.core.*", "horus.pipeline"]
strict = true

# ── pytest ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=horus --cov-report=term-missing --cov-fail-under=70"
filterwarnings = [
    "error::DeprecationWarning:horus.*",
]

[tool.coverage.run]
source = ["horus"]
omit = ["horus/web/__main__.py"]
