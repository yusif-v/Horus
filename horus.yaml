# Horus server config. Pass via: python3 -m horus --server --config horus.yaml
# All keys are optional; omitted keys fall back to defaults in horus/server.py.
# See horus.yaml.example for a documented template.

poll_intervals:
  nvd:         3600
  x_twitter:   1800
  github:      3600
  gitlab:      3600
  exploit_db:  7200
  epss:        86400
  kev:         86400

sources_enabled:
  nvd:        true
  x_twitter:  true
  github:     true
  gitlab:     true
  exploit_db: true
  epss:       true
  kev:        true

check_every_seconds: 60

web:
  enabled: true
  host: 127.0.0.1
  port: 8080
  workers: 2
  allow_dev_fallback: true

# Telegram bot — token can be set here (this file is gitignored) or via env var:
#   export TELEGRAM_BOT_TOKEN="your_token_from_botfather"
#   export TELEGRAM_BOT_USERNAME="your_bot_username"  (without @)
